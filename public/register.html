<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div style="display: flex; flex-direction: column; justify-content: center; min-height: 80vh;">
        <h1>Реєстрація</h1>
        <form id="registerForm">
            <input type="text" id="name" placeholder="Ім'я (Нікнейм)" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <input type="password" id="confirmPassword" placeholder="Підтвердіть пароль" required>
            <button type="submit">Зареєструватися</button>
        </form>
        <p id="message"></p>
        <p><a href="login.html">Вже є акаунт? Увійти</a></p>
    </div>
    
    <script src="js/register.js"></script>
</body>
</html>
